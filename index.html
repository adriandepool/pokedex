<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex en Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #3a3a3a;
            color: #f0f0f0;
            overflow: auto; /* Allow scrolling on small screens */
        }
        .pokedex-frame {
            border: 10px solid #d12a2a;
            border-radius: 20px 20px 20px 80px;
            background: #f04444;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 5px 5px 0 rgba(255,255,255,0.4), inset -5px -5px 0 rgba(0,0,0,0.3);
            width: 100%;
            max-width: 880px; /* Set a max width */
        }
        canvas {
            background-color: #98d8a0; /* Classic GameBoy green screen */
            border: 6px solid #333;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            image-rendering: pixelated; /* Keeps pokemon sprites sharp */
            width: 100%;
            height: auto;
            display: block;
        }
        .btn {
            transition: all 0.2s ease-in-out;
            border-radius: 9999px;
            border: 3px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }
        /* New styles for search and filter */
        .custom-select, .search-input {
            font-family: 'Press Start 2P', cursive;
            background-color: #f0f2f0;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 8px 12px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
            width: 100%;
            font-size: 0.75rem;
        }
        #autocomplete-results {
            position: absolute;
            background-color: #f0f2f0;
            border: 3px solid #333;
            border-top: none;
            border-radius: 0 0 10px 10px;
            z-index: 10;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
        }
        #autocomplete-results div {
            padding: 10px;
            cursor: pointer;
            color: #333;
            border-bottom: 2px solid #ccc;
        }
        #autocomplete-results div:last-child {
            border-bottom: none;
        }
        #autocomplete-results div:hover {
            background-color: #d1d5db;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

    <div class="pokedex-frame p-4 lg:p-8">
        <div class="flex items-center justify-center gap-4 mb-4">
            <h1 class="text-xl sm:text-2xl lg:text-3xl text-white drop-shadow-lg">Pokédex</h1>
            <!-- Simple Pokeball SVG -->
            <svg class="w-10 h-10 sm:w-12 sm:h-12" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" fill="white" stroke="black" stroke-width="4"/>
                <path d="M 2,50 A 48,48 0 0,1 98,50" fill="#f04444"/>
                <line x1="2" y1="50" x2="98" y2="50" stroke="black" stroke-width="8"/>
                <circle cx="50" cy="50" r="15" fill="white" stroke="black" stroke-width="4"/>
                <circle cx="50" cy="50" r="8" fill="black"/>
                <circle cx="50" cy="50" r="5" fill="white"/>
            </svg>
        </div>
        
        <!-- New Search and Filter Controls -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div class="relative">
                <input type="text" id="search-input" class="search-input" placeholder="Buscar Pokémon...">
                <div id="autocomplete-results" class="hidden"></div>
            </div>
            <select id="generation-select" class="custom-select"></select>
        </div>

        <canvas id="pokedexCanvas"></canvas> 
        <div class="flex justify-between mt-4 items-center px-2">
            <div class="flex gap-2 sm:gap-4">
                <button id="prevBtn" class="btn bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 sm:py-3 sm:px-6 text-sm sm:text-lg">Anterior</button>
                <button id="nextBtn" class="btn bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 sm:py-3 sm:px-6 text-sm sm:text-lg">Siguiente</button>
            </div>
            <button id="backBtn" class="btn bg-yellow-400 hover:bg-yellow-500 text-gray-800 font-bold p-3 sm:p-5 text-sm sm:text-lg hidden">Volver</button>
        </div>
    </div>

    <script type="module">
        const canvas = document.getElementById('pokedexCanvas');
        const ctx = canvas.getContext('2d');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const backBtn = document.getElementById('backBtn');
        const searchInput = document.getElementById('search-input');
        const generationSelect = document.getElementById('generation-select');
        const autocompleteResults = document.getElementById('autocomplete-results');

        let state = {
            currentView: 'list',
            pokemonList: [],
            selectedPokemon: null,
            limit: 12,
            offset: 0,
            isLoading: true,
            imageCache: new Map(),
            resizeTimer: null,
            allPokemonNames: [], // For autocomplete
            pokemonInGeneration: [], // For filtering
            currentEvolutionChain: null,
        };

        const PokedexConfig = {
            grid: { cols: 4, rows: 3 },
            card: { width: 180, height: 140, padding: 10 },
            sprite: { size: 96 },
            aspectRatio: 4 / 3,
        };
        
        // --- API Fetching ---
        async function fetchAllPokemonNames() {
            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1302'); // Fetch all for autocomplete
                const data = await response.json();
                state.allPokemonNames = data.results;
            } catch (error) {
                console.error("Failed to fetch all Pokémon names:", error);
            }
        }

        async function fetchGenerations() {
            try {
                const response = await fetch('https://pokeapi.co/api/v2/generation/');
                const data = await response.json();

                const detailPromises = data.results.map(gen => fetch(gen.url).then(res => res.json()));
                const generationDetails = await Promise.all(detailPromises);

                generationSelect.innerHTML = ''; // Clear previous options

                generationDetails.forEach(genDetail => {
                    const option = document.createElement('option');
                    option.value = `https://pokeapi.co/api/v2/generation/${genDetail.id}/`;

                    const gameNames = genDetail.version_groups
                        .map(vg => vg.name.replace(/-/g, ' & ').replace(/\b\w/g, l => l.toUpperCase()))
                        .join(' / ');
                    
                    option.textContent = gameNames;
                    generationSelect.appendChild(option);
                });

                handleGenerationChange();
            } catch (error) {
                console.error("Failed to fetch generations:", error);
            }
        }

        async function fetchPokemonByGeneration(url) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                state.pokemonInGeneration = data.pokemon_species;
            } catch (error) {
                console.error("Failed to fetch Pokémon by generation:", error);
                state.pokemonInGeneration = [];
            }
        }
        
        async function fetchPokemonDetails(urlOrName) {
            try {
                let name = urlOrName;
                if (urlOrName.includes('pokemon-species')) {
                    const parts = urlOrName.split('/');
                    name = parts[parts.length - 2];
                }
                const url = `https://pokeapi.co/api/v2/pokemon/${name}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Network response was not ok");
                return await response.json();
            } catch(error) {
                console.error("Failed to fetch Pokémon details:", error);
                return null;
            }
        }
        
        function flattenEvolutionChain(chainNode) {
            const chain = [];
            function traverse(node) {
                if (!node) return;
                const stage = [node.species.name];
                if (node.evolves_to && node.evolves_to.length > 0) {
                    const nextStage = node.evolves_to.flatMap(evolution => traverse(evolution));
                    // For branching evolutions (like Eevee), group them
                    if (nextStage.length > 1 && Array.isArray(nextStage[0])) {
                        stage.push(...nextStage);
                    } else if (nextStage.length > 0) {
                        stage.push(nextStage);
                    }
                }
                return stage;
            }
            // A bit complex to handle all branching cases, let's simplify to a flat list
            const names = [];
            function simpleTraverse(node) {
                if(!node) return;
                names.push(node.species.name);
                node.evolves_to.forEach(evo => simpleTraverse(evo));
            }
            simpleTraverse(chainNode);
            return [...new Set(names)]; // Return a flat list of all unique names
        }


        // --- Image Loading (with background removal) ---
        function loadImage(src) {
            if (state.imageCache.has(src)) {
                return Promise.resolve(state.imageCache.get(src));
            }
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous"; 
                img.onload = () => {
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    tempCtx.drawImage(img, 0, 0);
                    try {
                        const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                        const data = imageData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            if (data[i] > 245 && data[i + 1] > 245 && data[i + 2] > 245) {
                                data[i + 3] = 0;
                            }
                        }
                        tempCtx.putImageData(imageData, 0, 0);
                        const transparentImg = new Image();
                        transparentImg.onload = () => {
                            state.imageCache.set(src, transparentImg);
                            resolve(transparentImg);
                        };
                        transparentImg.onerror = reject;
                        transparentImg.src = tempCanvas.toDataURL();
                    } catch (e) {
                        state.imageCache.set(src, img);
                        resolve(img);
                    }
                }
                img.onerror = reject;
                img.src = src;
            });
        }
        
        // --- Canvas Drawing Functions ---
        function drawText(text, x, y, color = '#333', size = 16, align = 'left') {
            ctx.fillStyle = color;
            ctx.font = `${size}px 'Press Start 2P'`;
            ctx.textAlign = align;
            ctx.fillText(text, x, y);
        }
        
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawLoadingScreen() {
            clearCanvas();
            drawText('Cargando Pokémon...', canvas.width / 2, canvas.height / 2, '#333', 24, 'center');
        }

        async function drawListView() {
            canvas.style.imageRendering = 'pixelated';
            canvas.height = canvas.width / PokedexConfig.aspectRatio;

            const totalPaddingX = (PokedexConfig.grid.cols + 1) * PokedexConfig.card.padding;
            PokedexConfig.card.width = (canvas.width - totalPaddingX) / PokedexConfig.grid.cols;
            const totalPaddingY = (PokedexConfig.grid.rows + 1) * PokedexConfig.card.padding;
            PokedexConfig.card.height = (canvas.height - totalPaddingY) / PokedexConfig.grid.rows;
            
            clearCanvas();
            if (state.isLoading) {
                drawLoadingScreen();
                return;
            }
            if (!state.pokemonList.length) {
                drawText('No se encontraron Pokémon.', canvas.width / 2, canvas.height / 2, '#333', canvas.width > 500 ? 20 : 14, 'center');
                return;
            }
            
            for (let i = 0; i < state.pokemonList.length; i++) {
                const pokemon = state.pokemonList[i];
                if (!pokemon) continue;
                const row = Math.floor(i / PokedexConfig.grid.cols);
                const col = i % PokedexConfig.grid.cols;
                
                const x = col * PokedexConfig.card.width + PokedexConfig.card.padding * (col + 1);
                const y = row * PokedexConfig.card.height + PokedexConfig.card.padding * (row + 1);
                
                ctx.fillStyle = 'white';
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(x, y, PokedexConfig.card.width, PokedexConfig.card.height, [10]);
                ctx.fill();
                ctx.stroke();
                
                const name = pokemon.name.charAt(0).toUpperCase() + pokemon.name.slice(1);
                drawText(name, x + PokedexConfig.card.width / 2, y + PokedexConfig.card.height - (PokedexConfig.card.height * 0.15), '#333', PokedexConfig.card.height * 0.1, 'center');
                
                const id = `#${pokemon.id.toString().padStart(3, '0')}`;
                const idFontSize = PokedexConfig.card.height * 0.09;
                drawText(id, x + PokedexConfig.card.padding, y + PokedexConfig.card.padding + idFontSize, '#555', idFontSize, 'left');


                const spriteUrl = pokemon.sprites?.versions['generation-i']?.['red-blue']?.front_default || pokemon.sprites?.front_default;
                if(spriteUrl){
                    try {
                        const img = await loadImage(spriteUrl);
                        const boxWidth = PokedexConfig.card.width * 0.9;
                        const boxHeight = PokedexConfig.card.height * 0.7;
                        const scale = Math.min(boxWidth / img.width, boxHeight / img.height);
                        const drawWidth = img.width * scale;
                        const drawHeight = img.height * scale;
                        const drawX = x + (PokedexConfig.card.width - drawWidth) / 2;
                        const drawY = y + (boxHeight - drawHeight) / 2 + (PokedexConfig.card.padding * 0.5);
                        ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight);
                    } catch (e) {
                         drawText('?', x + PokedexConfig.card.width / 2, y + PokedexConfig.card.height * 0.5, '#333', 40, 'center');
                    }
                } else {
                    drawText('?', x + PokedexConfig.card.width / 2, y + PokedexConfig.card.height * 0.5, '#333', 40, 'center');
                }
            }
        }

        async function drawDetailView() {
            canvas.style.imageRendering = 'auto';
            const pokemon = state.selectedPokemon;
            if (!pokemon) {
                drawText('Error al cargar datos.', canvas.width / 2, canvas.height / 2, '#e11d48', 20, 'center');
                return;
            }
            const isMobile = canvas.width < 600;

            let evoSectionHeight = 0;
            const evoSpriteSize = isMobile ? 50 : 70;
            if (state.currentEvolutionChain && state.currentEvolutionChain.length > 0) {
                 const evoItemWidth = evoSpriteSize + 40;
                 const availableEvoWidth = canvas.width - 60;
                 let rows = 1;
                 let currentLineWidth = 0;
                 state.currentEvolutionChain.forEach((evo, index) => {
                    let itemWidth = evoSpriteSize;
                    if (index < state.currentEvolutionChain.length -1) itemWidth += 40; // Arrow space

                    if(currentLineWidth + itemWidth > availableEvoWidth) {
                        rows++;
                        currentLineWidth = 0;
                    }
                    currentLineWidth += itemWidth;
                 });
                 evoSectionHeight = (evoSpriteSize + 40) * rows + 40;
            } else {
                 evoSectionHeight = 60;
            }

            if (isMobile) {
                const spriteSize = canvas.width * 0.4;
                const spriteY = 20;
                const infoY = spriteY + spriteSize + 20;
                const statsYStart = infoY + 130; 
                const statRowHeight = 30;
                const statsBlockHeight = 30 + (pokemon.stats.length * statRowHeight);
                canvas.height = statsYStart + statsBlockHeight + 20 + evoSectionHeight;
            } else {
                canvas.height = canvas.width / PokedexConfig.aspectRatio + evoSectionHeight;
            }

            clearCanvas();
            
            let spriteSize, spriteX, spriteY, infoX, infoY;
            if (isMobile) {
                spriteSize = canvas.width * 0.4;
                spriteX = canvas.width / 2 - spriteSize / 2;
                spriteY = 20;
                infoX = 30;
                infoY = spriteY + spriteSize + 20;
            } else {
                const padding = canvas.width * 0.05;
                spriteSize = canvas.width * 0.3; 
                spriteX = padding;
                spriteY = (canvas.height - spriteSize - evoSectionHeight) / 2;
                infoX = spriteX + spriteSize + padding;
                infoY = padding * 1.5;
            }

            const containerPadding = 20;
            const containerX = spriteX - containerPadding;
            const containerY = spriteY - containerPadding;
            const containerWidth = spriteSize + containerPadding * 2;
            const containerHeight = spriteSize + containerPadding * 2;
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(containerX, containerY, containerWidth, containerHeight, [10]);
            ctx.fill();
            ctx.stroke();

            const spriteUrl = pokemon.sprites.other['official-artwork']?.front_default || pokemon.sprites.front_default;
            if(spriteUrl){
                try {
                    const img = await loadImage(spriteUrl);
                    ctx.drawImage(img, spriteX, spriteY, spriteSize, spriteSize);
                } catch(e) { /* ... */ }
            }
            const name = pokemon.name.charAt(0).toUpperCase() + pokemon.name.slice(1);
            drawText(`#${pokemon.id.toString().padStart(3, '0')}`, infoX, infoY, '#555', isMobile ? 18 : 24);
            drawText(name, infoX, infoY + (isMobile ? 30 : 40), '#333', isMobile ? 24 : 32);
            
            const typeColors = { normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', electric: '#F7D02C', grass: '#7AC74C', ice: '#96D9D6', fighting: '#C22E28', poison: '#A33EA1', ground: '#E2BF65', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A', rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746', steel: '#B7B7CE', fairy: '#D685AD' };
            pokemon.types.forEach((typeInfo, index) => {
                const typeName = typeInfo.type.name;
                drawText(typeName.toUpperCase(), infoX, infoY + (isMobile ? 70 : 90) + index * (isMobile ? 25 : 30), typeColors[typeName] || '#777', isMobile ? 14 : 18);
            });
            
            const statsYStart = infoY + (isMobile ? 130 : 170);
            drawText('Estadísticas:', infoX, statsYStart, '#333', isMobile ? 16 : 20);
            pokemon.stats.forEach((statInfo, index) => {
                const statName = statInfo.stat.name.replace('special-', 'sp. ');
                const yPos = statsYStart + 30 + index * (isMobile ? 30 : 40);
                drawText(`${statName}: ${statInfo.base_stat}`, infoX, yPos, '#333', isMobile ? 12 : 14);
                const barWidth = isMobile ? canvas.width - infoX * 2 : (canvas.width - infoX - (canvas.width * 0.05));
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(infoX, yPos + 10, barWidth, 10);
                const statPercentage = statInfo.base_stat / 255;
                ctx.fillStyle = statPercentage > 0.6 ? '#4ade80' : statPercentage > 0.3 ? '#facc15' : '#f87171';
                ctx.fillRect(infoX, yPos + 10, (statInfo.base_stat / 255) * barWidth, 10); 
            });

            const statsBlockHeight = 30 + (pokemon.stats.length * 30);
            const evoYStart = isMobile 
                ? statsYStart + statsBlockHeight + 20
                : canvas.width / PokedexConfig.aspectRatio;

            drawText('Evoluciones:', 30, evoYStart, '#333', isMobile ? 16 : 20);

            if (state.currentEvolutionChain === null) {
                drawText('Cargando...', 30, evoYStart + 30, '#555', isMobile ? 12 : 14);
            } else if (state.currentEvolutionChain.length <= 1) { // If it's 1, it's just the base form
                drawText('No tiene evoluciones.', 30, evoYStart + 30, '#555', isMobile ? 12 : 14);
            } else {
                let currentX = 30;
                let currentY = evoYStart + 20;

                for (const [index, evo] of state.currentEvolutionChain.entries()) {
                    if (!evo) continue;

                    if (currentX + evoSpriteSize > canvas.width - 30 && index > 0) {
                        currentX = 30;
                        currentY += evoSpriteSize + 40;
                    }

                    const spriteUrl = evo.sprites.front_default;
                    if (spriteUrl) {
                        try {
                            const img = await loadImage(spriteUrl);
                            ctx.drawImage(img, currentX, currentY, evoSpriteSize, evoSpriteSize);
                        } catch (e) { /* ignore */ }
                    }
                    const name = evo.name.charAt(0).toUpperCase() + evo.name.slice(1);
                    drawText(name, currentX + evoSpriteSize / 2, currentY + 10 + evoSpriteSize, '#333', isMobile ? 10 : 12, 'center');
                    
                    currentX += evoSpriteSize;
                    
                    if (index < state.currentEvolutionChain.length - 1) {
                         const arrowWidth = 40;
                         if (currentX + arrowWidth < canvas.width - 30) {
                            const arrowX = currentX + (arrowWidth / 2);
                            const arrowY = currentY + (evoSpriteSize / 2);
                            drawText('>', arrowX, arrowY, '#333', isMobile ? 18 : 22, 'center');
                            currentX += arrowWidth;
                         } else {
                            currentX = 30;
                            currentY += evoSpriteSize + 40;
                         }
                    }
                }
            }
        }
        
        // --- Main Application Logic & Event Handlers ---
        function updateUIForView() {
            if(state.currentView === 'list') {
                backBtn.classList.add('hidden');
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                generationSelect.classList.remove('hidden');
                document.querySelector('#search-input').parentElement.classList.remove('hidden');
            } else {
                backBtn.classList.remove('hidden');
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
                generationSelect.classList.add('hidden');
                document.querySelector('#search-input').parentElement.classList.add('hidden');
            }
        }
        
        async function loadCurrentPage() {
            state.isLoading = true;
            drawListView();
            const pokemonToFetch = state.pokemonInGeneration.slice(state.offset, state.offset + state.limit);
            const detailPromises = pokemonToFetch.map(p => fetchPokemonDetails(p.url || p.pokemon_species.url));
            state.pokemonList = await Promise.all(detailPromises);
            state.isLoading = false;
            drawListView();
        }

        async function navigate(direction) {
            const newOffset = state.offset + direction * state.limit;
            if (newOffset >= 0 && newOffset < state.pokemonInGeneration.length) {
                state.offset = newOffset;
                await loadCurrentPage();
            }
        }
        
        async function showDetailView(pokemon) {
            state.selectedPokemon = pokemon;
            state.currentView = 'detail';
            state.currentEvolutionChain = null;
            updateUIForView();
            drawDetailView();

            try {
                const speciesResponse = await fetch(pokemon.species.url);
                const speciesData = await speciesResponse.json();
                
                const evolutionChainResponse = await fetch(speciesData.evolution_chain.url);
                const evolutionChainData = await evolutionChainResponse.json();

                const evolutionNames = flattenEvolutionChain(evolutionChainData.chain);
                
                const evolutionDetails = await Promise.all(evolutionNames.map(name => fetchPokemonDetails(name)));
                
                state.currentEvolutionChain = evolutionDetails.filter(p => p); // Show the full chain

            } catch (error) {
                console.error("Failed to fetch evolution chain:", error);
                state.currentEvolutionChain = [];
            }
            drawDetailView();
        }

        function handleCanvasClick(event) {
            if (state.currentView !== 'list') return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;
            
            for (let i = 0; i < state.pokemonList.length; i++) {
                const row = Math.floor(i / PokedexConfig.grid.cols);
                const col = i % PokedexConfig.grid.cols;
                const cardX = col * PokedexConfig.card.width + PokedexConfig.card.padding * (col + 1);
                const cardY = row * PokedexConfig.card.height + PokedexConfig.card.padding * (row + 1);
                
                if (x > cardX && x < cardX + PokedexConfig.card.width && y > cardY && y < cardY + PokedexConfig.card.height) {
                    showDetailView(state.pokemonList[i]);
                    break;
                }
            }
        }

        async function handleGenerationChange() {
            state.isLoading = true;
            drawListView();
            await fetchPokemonByGeneration(generationSelect.value);
            state.offset = 0;
            await loadCurrentPage();
        }

        function handleSearchInput() {
            const query = searchInput.value.toLowerCase();
            if (query.length < 2) {
                autocompleteResults.innerHTML = '';
                autocompleteResults.classList.add('hidden');
                return;
            }
            const matches = state.allPokemonNames.filter(p => p.name.includes(query)).slice(0, 5);
            autocompleteResults.innerHTML = '';
            if (matches.length > 0) {
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.textContent = match.name;
                    div.addEventListener('click', async () => {
                        searchInput.value = '';
                        autocompleteResults.classList.add('hidden');
                        const selected = await fetchPokemonDetails(match.name);
                        if(selected){
                           showDetailView(selected);
                        }
                    });
                    autocompleteResults.appendChild(div);
                });
                autocompleteResults.classList.remove('hidden');
            } else {
                autocompleteResults.classList.add('hidden');
            }
        }

        function redrawCurrentView() {
            if (state.currentView === 'list') {
                drawListView();
            } else {
                drawDetailView();
            }
        }

        function handleResize() {
            const containerWidth = canvas.parentElement.clientWidth;
            canvas.width = containerWidth;
            if (containerWidth < 500) { PokedexConfig.grid.cols = 2; PokedexConfig.grid.rows = 3; } 
            else if (containerWidth < 820) { PokedexConfig.grid.cols = 3; PokedexConfig.grid.rows = 3; } 
            else { PokedexConfig.grid.cols = 4; PokedexConfig.grid.rows = 3; }
            state.limit = PokedexConfig.grid.cols * PokedexConfig.grid.rows;
            redrawCurrentView();
        }

        function debounceResize() {
            clearTimeout(state.resizeTimer);
            state.resizeTimer = setTimeout(handleResize, 100);
        }

        async function init() {
            canvas.addEventListener('click', handleCanvasClick);
            prevBtn.addEventListener('click', () => navigate(-1));
            nextBtn.addEventListener('click', () => navigate(1));
            backBtn.addEventListener('click', () => {
                state.currentView = 'list';
                state.selectedPokemon = null;
                updateUIForView();
                loadCurrentPage(); 
            });
            generationSelect.addEventListener('change', handleGenerationChange);
            searchInput.addEventListener('input', handleSearchInput);
            document.addEventListener('click', (e) => { // Hide autocomplete on outside click
                if (!searchInput.contains(e.target)) {
                    autocompleteResults.classList.add('hidden');
                }
            });
            
            await document.fonts.ready;
            window.addEventListener('resize', debounceResize);
            handleResize();
            updateUIForView();
            
            drawLoadingScreen();
            await fetchAllPokemonNames();
            await fetchGenerations(); // This will trigger the first load
        }

        init();
    </script>
</body>
</html>
